services:
  server:
    build: .
    environment:
      EGG_KEYS: ${EGG_KEYS}
      JWT_SECRET: ${JWT_SECRET}
      MAINTAIN_TOKEN: ${MAINTAIN_TOKEN}
      # 与镜像 ENV 一致；数据目录与代码目录分离，禁止挂载 /app/database
      DB_PATH: /app/data/database/comic.db
    volumes:
      - ./data/database:/app/data/database
      - ./data/images:/app/public/images
    ports:
      - "80:7001"
    restart: unless-stopped
    # 镜像内已定义 HEALTHCHECK；此处显式写出便于 compose ps 观察
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:7001/',r=>process.exit(r.statusCode&&r.statusCode<500?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
